name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install CPU-only torch
        # GitHub Actions runners have no GPU and a limited disk (~14GB).
        # `pip install -e ".[dev]"` alone resolves the bare "torch"
        # dependency on Linux to the full CUDA-enabled wheel, which
        # bundles several GB of NVIDIA CUDA toolkit libraries (cudnn,
        # cublas, cufft, cusolver, triton, ...) the runner will never
        # use. Confirmed as a real failure: an unconstrained CI run hit
        # "OSError: [Errno 28] No space left on device" mid-install.
        # Installing the CPU-only build first satisfies the dependency
        # before the main install step ever considers the CUDA variant.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project with dev extras
        run: pip install -e ".[dev]"
      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest, with coverage)
        run: pytest --cov=src --cov-report=term-missing