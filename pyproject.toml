[project]
name = "research_project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "torch",
    "dvc",
    "mlflow",
    "dagshub",
    "medpy",           # correct HD95 (Phase 3, 3.4)
    "nibabel",         # reads raw .nii volumes (Phase 3, 3.2) — needed but not in the original list
    "batchgenerators", # real BraTS augmentation (Phase 4, 4.1)
    "scikit-learn",    # deterministic KFold splitting (Phase 8, 8.1) + LogisticRegression (Phase 10, 10.3)
    "pandas",          # per-case score tables + ranking (Phase 8, 8.3)
    "scipy",           # Spearman correlation for rank stability (Phase 11, 11.1)
    "scikit-image",    # marching cubes for the 3D segmentation render in qualitative_figure.py
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black", "mypy"]

[project.scripts]
train = "src.training.run:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]